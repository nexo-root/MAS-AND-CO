<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Lo que sigue es la cabecera de la HOME. Cada ruta la reescribe desde
         src/seo/Cabeza.tsx (title, description, canonical, OG, Twitter y su
         JSON-LD), y el prerender guarda el resultado por pagina. -->
    <title>Páginas web para negocios en Argentina, listas en días | Mas &amp; Co</title>
    <meta name="description" content="Construimos la página web de tu negocio en días. Diseño propio, no plantillas. Presupuesto en el día, y la mitad la pagás recién cuando la ves terminada." />
    <link rel="canonical" href="https://masandcoweb.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="Mas &amp; Co" />
    <meta property="og:url" content="https://masandcoweb.com/" />
    <meta property="og:title" content="Páginas web para negocios en Argentina, listas en días | Mas &amp; Co" />

    <meta name="twitter:description" content="Tu página lista en días. Presupuesto en el día, y la mitad la pagás recién cuando la ves terminada." />
    <meta name="twitter:image" content="https://masandcoweb.com/og-masandco.png" />
    <!-- el tema guardado se aplica ANTES del primer cuadro: el HTML prerenderizado
         sale en claro, y sin esto un usuario en oscuro veria un flash de papel -->
    <script>try{if(localStorage.getItem("tema")==="oscuro")document.documentElement.dataset.tema="oscuro"}catch(e){}</script>
    <!-- El icono. Google lo rastrea aparte del HTML y solo muestra el que
         esta DECLARADO aca: sin este link no aparece logo en el resultado.
         Va PNG ademas del SVG porque Google pide un raster cuadrado. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- La letra vive en el sitio (src/index.css): sin la hoja de Google Fonts,
         que bloqueaba el primer pintado. Se precarga la de caracteres latinos,
         que es la unica que usa el castellano. -->
    <link rel="preload" href="/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- El grafo comun a todo el sitio. Lo que cambia por pagina (WebPage, migas,
         FAQPage, Service) lo agrega la Cabeza en <script id="ld-pagina">. -->

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Cloudflare Web Analytics (sin cookies). Se carga SOLO en el dominio real:
         asi el prerender, la verificacion y las capturas locales no cuentan
         como visitas, y el HTML prerenderizado no queda con el beacon duplicado. -->
    <script>
      if (location.hostname === "masandcoweb.com") {
        var cf = document.createElement("script")
        cf.type = "module"
        cf.src = "https://static.cloudflareinsights.com/beacon.min.js"
        cf.setAttribute("data-cf-beacon", '{"token": "94cc48e8d3804eb0b66e4b515f16be84"}')
        document.body.appendChild(cf)
      }
    </script>
