name: Reels de Mas & Co

on:
  # Fábrica vieja APAGADA (Felipe, 5/11/2026): reemplazada por los videos de Content Factory, que se programan a mano.
  # Sin cron: solo corre si alguien la lanza a mano desde Actions. Además feed/PAUSA la frena.
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha AAAA-MM-DD para recuperar un reel a mano (vacio = hoy)"
        default: ""

permissions:
  contents: read

# Si dos corridas atrasadas arrancan juntas, la segunda espera a que termine la primera.
concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar el reel del dia
        env:
          META_TOKEN: ${{ secrets.META_TOKEN_MASANDCO }}
          FECHA: ${{ inputs.fecha }}
        working-directory: feed
        run: python publicar_reel.py
